<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Où stocker les données en santé ?</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--tx:#17212b;--mu:#5b6b7a;--ac:#0b6e8a;--ac2:#e3f2f7;--bd:#d3dde6;--ok:#1b7f4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a22;--card:#192633;--tx:#e8eef3;--mu:#9fb0bf;--ac:#4cc3e3;--ac2:#1d3b4a;--bd:#2c4152;--ok:#5fd38d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a22;--card:#192633;--tx:#e8eef3;--mu:#9fb0bf;--ac:#4cc3e3;--ac2:#1d3b4a;--bd:#2c4152;--ok:#5fd38d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:.2em 0 .4em}h2{font-size:1.25rem;margin:0 0 .3em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
.mu{color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0a1a22}}
button.sec{background:var(--ac2);color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.crit{padding:14px 0;border-top:1px solid var(--bd)}
.crit:first-of-type{border-top:0}
.crit h3{margin:0 0 8px;font-size:1rem}
.scale{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.scale .l{font-size:.85rem;color:var(--mu)}.scale .r{font-size:.85rem;color:var(--mu);text-align:right}
.pts{display:flex;gap:6px}
.pts label{position:relative}
.pts input{position:absolute;opacity:0}
.pts span{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:50%;cursor:pointer;font-weight:600}
.pts input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff}
.pts input:focus-visible+span{outline:3px solid var(--ac);outline-offset:2px}
@media(max-width:560px){.scale{grid-template-columns:1fr 1fr}.pts{grid-column:1/-1;order:-1;justify-content:center}.pts span{width:44px;height:44px}}
.dec{background:var(--ac2);border-radius:12px;padding:14px;margin-top:10px}
.dec h3{margin:0 0 10px;font-size:1.05rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.opt{display:flex;gap:8px;align-items:center;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.wrap{overflow-x:auto}
.hide{display:none}
</style>
</head>
<body>
<main id="app"></main>
<script>
const D=[
"Des résultats de laboratoire de la dernière semaine",
"Des dossiers patients électroniques de personnes décédées",
"Des verbatims d’enregistrements audio de consultations médicales, une fois la note clinique saisie",
"Une banque de données massives biomédicales conservées pour la recherche",
"Les signes vitaux en temps réel d’un moniteur de signes vitaux",
"Les données démographiques sur les admissions à l’urgence des 20 dernières années",
"La base de données des personnes inscrites et admissibles à la RAMQ"];
const C=[
["Changement des données","Il est probable que les données changent rapidement","Il est peu probable ou impossible que les données changent rapidement"],
["Accès aux données","Les données doivent être accessibles rapidement, voire sans délai","Les données n’ont pas à être accessibles rapidement"],
["Sensibilité des données","Les données sont hautement sensibles","Les données sont peu sensibles"],
["Sécurité des données","Il serait extrêmement grave de perdre ces données","Il ne serait pas très grave de perdre ces données"]];
const DEC=[
["Localisation","Stockage local","Stockage infonuagique"],
["Fournisseur","Fournisseur canadien","Fournisseur étranger"],
["Type de stockage","Stockage froid (bande magnétique)","Stockage chaud (SSD, voire mémoire vive)"]];
const S={name:"",step:0,r:D.map(()=>[0,0,0,0]),d:D.map(()=>[null,null,null])};
const app=document.getElementById("app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function start(){
 app.innerHTML=`<h1>Où stocker les données en santé ?</h1>
 <div class="card"><p>Dans cette activité, vous analyserez ${D.length} types de données en santé selon quatre caractéristiques, puis vous déciderez où et comment les stocker.</p>
 <label class="f" for="p">Prénom</label><input type="text" id="p" autocomplete="given-name">
 <label class="f" for="n">Nom</label><input type="text" id="n" autocomplete="family-name">
 <p style="margin-top:18px"><button id="go" disabled>Commencer</button></p></div>`;
 const p=document.getElementById("p"),n=document.getElementById("n"),g=document.getElementById("go");
 const chk=()=>g.disabled=!(p.value.trim()&&n.value.trim());
 p.oninput=n.oninput=chk;
 g.onclick=()=>{S.name=p.value.trim()+" "+n.value.trim();S.step=1;page()};
}

function page(){
 const i=S.step-1,total=D.length;
 if(S.step>total) return recap();
 app.innerHTML=`<p class="mu" style="margin:0">${esc(S.name)} · Donnée ${S.step} sur ${total}</p>
 <div class="bar"><i style="width:${(i/total)*100}%"></i></div>
 <div class="card"><p class="mu" style="margin:0">Type de données</p><h2>${esc(D[i])}</h2>
 <p class="mu">Pour chaque caractéristique, placez le curseur entre 1 et 5 selon les deux extrêmes proposés.</p>
 ${C.map((c,k)=>`<div class="crit"><h3>${c[0]}</h3><div class="scale"><div class="l">1 — ${c[1]}</div>
 <div class="pts">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="c${k}" value="${v}" ${S.r[i][k]==v?"checked":""}><span>${v}</span></label>`).join("")}</div>
 <div class="r">5 — ${c[2]}</div></div></div>`).join("")}
 <div class="dec hide" id="dec"><h3>Votre décision de stockage</h3>
 ${DEC.map((d,k)=>`<div class="mu" style="font-size:.85rem;margin:6px 0 4px">${d[0]}</div><div class="row">
 ${[1,2].map(o=>`<label class="opt"><input type="radio" name="d${k}" value="${o}" ${S.d[i][k]==o?"checked":""}> ${d[o]}</label>`).join("")}</div>`).join("")}</div></div>
 <div class="nav"><button class="sec" id="prev">← Précédent</button><button id="next" disabled>${S.step==total?"Voir mon résumé":"Suivant →"}</button></div>`;
 const dec=document.getElementById("dec"),nx=document.getElementById("next");
 const upd=()=>{
  const all=S.r[i].every(v=>v>0);
  dec.classList.toggle("hide",!all);
  nx.disabled=!(all&&S.d[i].every(v=>v));
 };
 C.forEach((_,k)=>app.querySelectorAll(`input[name=c${k}]`).forEach(e=>e.onchange=()=>{S.r[i][k]=+e.value;upd()}));
 DEC.forEach((_,k)=>app.querySelectorAll(`input[name=d${k}]`).forEach(e=>e.onchange=()=>{S.d[i][k]=+e.value;upd()}));
 document.getElementById("prev").onclick=()=>{S.step--;S.step<1?(S.step=0,start()):page()};
 nx.onclick=()=>{S.step++;page();scrollTo(0,0)};
 upd();
}

function recap(){
 app.innerHTML=`<h1>Résumé de vos choix</h1><p class="mu">${esc(S.name)} — ${new Date().toLocaleDateString("fr-CA")}</p>
 <div class="card wrap"><table><thead><tr><th>Données</th><th>Changement</th><th>Accès</th><th>Sensibilité</th><th>Sécurité</th><th>Décision</th></tr></thead><tbody>
 ${D.map((t,i)=>`<tr><td>${esc(t)}</td>${S.r[i].map(v=>`<td>${v}/5</td>`).join("")}<td>${DEC.map((d,k)=>d[S.d[i][k]]).join("<br>")}</td></tr>`).join("")}
 </tbody></table>
 <p class="mu" style="font-size:.85rem">1 = premier extrême (ex. changement rapide, accès immédiat, très sensible, perte très grave) · 5 = second extrême.</p></div>

 <div class="nav"><button class="sec" id="back">← Modifier</button></div>`;
 document.getElementById("back").onclick=()=>{S.step=D.length;page()};
 document.getElementById("print").onclick=()=>window.print();
}
start();
</script>
</body>
</html>
